services:
  postgres:
    image: postgres:16-alpine
    container_name: paytm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paytm
    ports:
      - "5432:5432"
    volumes:
      - paytm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paytm-postgres:
